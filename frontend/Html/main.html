<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Threat Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --glow-color: #00ffff;
        --danger-color: #ff3b3b;
      }

      body {
        font-family: "Share Tech Mono", monospace;
        background-color: #0c0c0e;
        color: var(--glow-color);
        text-shadow: 0 0 5px var(--glow-color);
        position: relative; /* relative so child (container) can be placed inside */
        width: 100%; /* full width */
        height: 100vh; /* full screen height */
        background: lightgray;
      }

      .container-glow {
        border: 1px solid var(--glow-color);
        box-shadow: 0 0 15px var(--glow-color), inset 0 0 10px var(--glow-color);
        background: radial-gradient(
          circle,
          rgba(12, 12, 14, 0.9) 0%,
          rgba(12, 12, 14, 0.95) 100%
        );

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        height: auto; /* or simply remove height */
        padding: 15px; /* gives spacing inside */
        background: rgba(37, 5, 5, 0.107);
        border: 2px solid black;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* shadow for effect */
        border: 1px solid var(--glow-color);
        box-shadow: 0 0 15px var(--glow-color), inset 0 0 10px var(--glow-color);
      }

      .title-glow {
        animation: glow 2.5s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 5px var(--glow-color), 0 0 10px var(--glow-color);
        }
        to {
          text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
        }
      }

      .progress-bar-inner {
        background: repeating-linear-gradient(
          45deg,
          var(--glow-color),
          var(--glow-color) 10px,
          #00b8b8 10px,
          #00b8b8 20px
        );
        box-shadow: 0 0 10px var(--glow-color);
        animation: progressBarAnimate 15s linear infinite;
      }

      @keyframes progressBarAnimate {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 100% 0;
        }
      }

      .threat-text {
        color: var(--danger-color);
        text-shadow: 0 0 10px var(--danger-color);
        animation: threat-pulse 1s infinite alternate;
      }

      @keyframes threat-pulse {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.02);
        }
      }
    </style>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body class="flex items-center justify-center min-h-screen p-4">
    <canvas>
    </canvas>
    <!-- <h1>Aavattfo</h1> -->
    <div
      id="scanner-ui"
      class="w-full max-w-2xl p-6 md:p-8 rounded-lg container-glow transition-all duration-500"
    >
      <!-- Header -->
      <header class="text-center mb-6">
        <h1 class="text-2xl md:text-4xl font-bold title-glow">
          THREAT SCANNER
        </h1>
        <p class="text-sm opacity-70 mt-1">
          [v1.0.0] – YOLO-based CCTV Threat Detection System
        </p>
      </header>

      <!-- Initial State: File Picker -->
      <div id="initial-state" class="text-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-16 w-16 mx-auto mb-4 opacity-50"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
        <p id="status-text" class="mb-4 text-lg">SYSTEM IDLE. AWAITING FILE.</p>
        <label
          for="file-upload"
          class="cursor-pointer inline-block bg-cyan-500/10 border border-cyan-500 text-cyan-400 font-bold py-3 px-6 rounded-md hover:bg-cyan-500/20 hover:text-white transition-all duration-300 shadow-[0_0_15px_rgba(0,255,255,0.5)]"
        >
          SELECT FILE TO SCAN
        </label>
        <input id="file-upload" type="file" class="hidden" />
      </div>

      <!-- Scanning State -->
      <div id="scanning-state" class="hidden">
        <p id="scanning-filename" class="text-center text-lg mb-2 truncate"></p>
        <div
          class="w-full bg-cyan-900/50 rounded-full h-4 border border-cyan-700 shadow-inner overflow-hidden"
        >
          <div
            id="progress-bar"
            class="h-full rounded-full progress-bar-inner transition-all duration-500 ease-linear"
            style="width: 0%"
          ></div>
        </div>
        <p id="scan-status" class="text-center text-sm mt-2 opacity-80 h-5"></p>
      </div>

      <!-- Threat Found State -->
      <div id="threat-state" class="hidden text-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-16 w-16 mx-auto mb-4 text-red-500"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            fill-rule="evenodd"
            d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.21 3.03-1.742 3.03H4.42c-1.532 0-2.492-1.696-1.742-3.03l5.58-9.92zM10 13a1 1 0 110-2 1 1 0 010 2zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
        <h2 class="text-3xl md:text-5xl font-extrabold threat-text">
          ! THREAT DETECTED !
        </h2>

        <div
          class="mt-6 text-left bg-red-900/20 border border-red-500 rounded-md p-4 text-sm md:text-base"
        >
          <div class="grid grid-cols-3 gap-2">
            <span class="font-bold opacity-70">FILE:</span>
            <span id="threat-filename" class="col-span-2 truncate"></span>

            <span class="font-bold opacity-70">SEVERITY:</span>
            <span class="col-span-2 text-red-400 font-bold">CRITICAL</span>

            <span class="font-bold opacity-70">SIGNATURE:</span>
            <span class="col-span-2">Weapon Detected (Handgun)</span>

            <span class="font-bold opacity-70">ACTION:</span>
            <span class="col-span-2">Alert Triggered – Security Notified</span>
          </div>
        </div>

        <button
          id="reset-button"
          class="mt-8 bg-cyan-500/10 border border-cyan-500 text-cyan-400 font-bold py-2 px-5 rounded-md hover:bg-cyan-500/20 hover:text-white transition-all duration-300"
        >
          SCAN ANOTHER FILE
        </button>
      </div>
    </div>
    <div>
        © 2025 Threat Detection System. All Rights Reserved.
    </div>
    <script>
      const fileUpload = document.getElementById("file-upload");
      const initialState = document.getElementById("initial-state");
      const scanningState = document.getElementById("scanning-state");
      const threatState = document.getElementById("threat-state");
      const resetButton = document.getElementById("reset-button");

      const progressBar = document.getElementById("progress-bar");
      const scanStatus = document.getElementById("scan-status");
      const scanningFilename = document.getElementById("scanning-filename");
      const threatFilename = document.getElementById("threat-filename");

      const scanMessages = [
        "Initializing quantum heuristics...",
        "Analyzing file structure...",
        "Decompiling binary...",
        "Cross-referencing signatures...",
        "Checking for polymorphic code...",
        "Anomaly detected in memory block 0xDEADBEEF...",
        "Isolating malicious payload...",
        "Finalizing report...",
      ];

      fileUpload.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;

        // --- UI Transition: Initial -> Scanning ---
        initialState.classList.add("hidden");
        scanningState.classList.remove("hidden");
        scanningFilename.textContent = `ANALYZING: ${file.name}`;

        let progress = 0;
        let messageIndex = 0;

        scanStatus.textContent = scanMessages[messageIndex];

        // --- Simulate Scan Progress ---
        const interval = setInterval(() => {
          progress += Math.random() * 10;
          if (progress > 100) {
            progress = 100;
          }
          progressBar.style.width = `${progress}%`;

          // Update status message at certain progress points
          const nextMessageThreshold =
            (messageIndex + 1) * (100 / scanMessages.length);
          if (progress >= nextMessageThreshold) {
            messageIndex++;
            if (messageIndex < scanMessages.length) {
              scanStatus.textContent = scanMessages[messageIndex];
            }
          }

          // --- End of Scan ---
          if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => {
              // --- UI Transition: Scanning -> Threat Found ---
              scanningState.classList.add("hidden");
              threatState.classList.remove("hidden");
              threatFilename.textContent = file.name;
            }, 700);
          }
        }, 400);
      });

      // --- Reset Button Logic ---
      resetButton.addEventListener("click", () => {
        threatState.classList.add("hidden");
        initialState.classList.remove("hidden");

        // Reset progress bar and statuses
        progressBar.style.width = "0%";
        scanStatus.textContent = "";
        scanningFilename.textContent = "";
        threatFilename.textContent = "";

        // Reset file input value to allow re-selection of the same file
        fileUpload.value = "";
      });
    </script>
    <script src="main.js"></script>
  </body>
</html>
